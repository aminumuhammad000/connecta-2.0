[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_CLIENT_ID,NEXT_PUBLIC_GOOGLE_CLIENT_ID,FLUTTERWAVE_SECRET_HASH,SUPABASE_SERVICE_ROLE_KEY"
  SECRETS_SCAN_OMIT_PATHS = ".env.example"
