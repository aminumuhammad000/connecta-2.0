<svg xmlns="http://www.w3.org/2000/svg" width="640" height="299" viewBox="0 0 640 299">
  <!-- Background Deep Emerald -->
  <rect width="640" height="299" fill="#0A2614" rx="16"/>

  <!-- Left Wavy Organic Amber Blob -->
  <path d="M -20,120 C 60,110 120,180 140,240 C 150,270 120,310 100,330 L -20,330 Z" 
        fill="#F59E0B" stroke="#0A1020" stroke-width="6" stroke-linejoin="round"/>

  <!-- Secondary Curved Azure Blob in Corner -->
  <path d="M 120,340 C 180,260 260,250 320,320 L 320,340 Z" 
        fill="#1A73E8" stroke="#0A1020" stroke-width="6" stroke-linejoin="round"/>

  <!-- Decorative Sparkles -->
  <circle cx="80" cy="60" r="4" fill="#FFFFFF"/>
  <circle cx="140" cy="90" r="5" fill="#10B981"/>
  <circle cx="240" cy="70" r="6" fill="#FFFFFF"/>
  <circle cx="210" cy="160" r="4" fill="#F59E0B"/>

  <!-- Modern 3D Heavy-Duty Technician Toolcase on Right -->
  <g transform="translate(350, 45)">
    <!-- Shadow -->
    <rect x="15" y="220" width="220" height="20" rx="10" fill="#05120A" opacity="0.6"/>

    <!-- Toolcase Main Body -->
    <rect x="20" y="40" width="210" height="175" rx="18" fill="#111827" stroke="#0A1020" stroke-width="6"/>

    <!-- Top Handle Assembly -->
    <rect x="75" y="10" width="100" height="30" rx="10" fill="#1A73E8" stroke="#0A1020" stroke-width="5"/>
    <rect x="95" y="20" width="60" height="12" rx="6" fill="#0A2614"/>

    <!-- Lid Flap Division / Top Cap -->
    <path d="M 20,40 L 230,40 L 230,85 L 20,85 Z" fill="#10B981" stroke="#0A1020" stroke-width="6"/>
    <!-- Lid Accent Bar -->
    <line x1="40" y1="62" x2="210" y2="62" stroke="#0A2614" stroke-width="4" stroke-linecap="round"/>

    <!-- Dual Heavy Latches -->
    <rect x="55" y="70" width="22" height="30" rx="4" fill="#F59E0B" stroke="#0A1020" stroke-width="3"/>
    <rect x="173" y="70" width="22" height="30" rx="4" fill="#F59E0B" stroke="#0A1020" stroke-width="3"/>

    <!-- Center Connecta Open-Circle Brand Mark -->
    <g transform="translate(75, 95)">
      <!-- Azure Segment -->
      <path d="M 69,22 C 56,10 39,10 27,22 C 15,34 14,51 21,63"
            fill="none" stroke="#1A73E8" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Amber Segment -->
      <path d="M 21,63 C 28,75 40,82 52,80"
            fill="none" stroke="#F59E0B" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Green Segment -->
      <path d="M 52,80 C 64,78 73,68 76,56"
            fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Corner Rubber Bumper Guards -->
    <rect x="16" y="175" width="20" height="42" rx="6" fill="#F59E0B" stroke="#0A1020" stroke-width="3"/>
    <rect x="214" y="175" width="20" height="42" rx="6" fill="#F59E0B" stroke="#0A1020" stroke-width="3"/>
  </g>
</svg>
